<style id="app-style">
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#EEF4FA;
  --border:#D8E4EE;
  --ink:#16202B;
  --ink-soft:#57697A;
  --ink-faint:#8598A8;
  --paprika:#397EAD;
  --paprika-ink:#FFFFFF;
  --teal:#397F48;
  --teal-ink:#FFFFFF;
  --purple:#7D4083;
  --gold:#9C7220;
  --gold-fill:#F8B132;
  --whatsapp:#25D366;
  --whatsapp-ink:#FFFFFF;
  --danger:#B23B3B;
  --danger-ink:#FFF9F0;
  --focus:#397EAD;
  --shadow: 0 1px 2px rgba(15,30,50,0.06), 0 4px 14px rgba(15,30,50,0.07);
  --font-display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --font-body:'Public Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;color:var(--ink);}
p{margin:0;}
a{color:var(--teal);}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:0.95rem;}
::selection{background:var(--paprika);color:var(--paprika-ink);}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px;}

#app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:76px;}

.header{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:14px 16px 10px;
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;max-width:1040px;margin:0 auto;width:100%;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:9px;line-height:1.1;min-width:0;}
.brand-mark{flex:none;height:27px;width:auto;}
.brand-text{display:flex;flex-direction:column;min-width:0;}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:1.1rem;letter-spacing:-0.01em;white-space:nowrap;}
.brand-name .n1{color:var(--paprika);}
.brand-name .n2{color:var(--teal);}
.brand-name .n3{color:var(--purple);}
.brand-tag{font-size:0.68rem;font-weight:600;letter-spacing:0.02em;color:var(--ink-faint);white-space:nowrap;}
@media (min-width:420px){
  .brand-mark{height:34px;}
  .brand-name{font-size:1.3rem;}
  .brand-tag{font-size:0.74rem;}
}
.proyecto-switch{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.proyecto-switch button{
  border:none;background:transparent;color:var(--ink-soft);font-size:0.78rem;font-weight:600;
  padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.proyecto-switch button.active{background:var(--paprika);color:var(--paprika-ink);}

.main{flex:1;max-width:1040px;margin:0 auto;padding:16px;width:100%;}

.search-row{display:flex;gap:8px;margin-bottom:12px;}
.search-input-wrap{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:10px 16px;box-shadow:var(--shadow);
}
.search-input-wrap svg{flex:none;color:var(--ink-faint);}
.search-input-wrap input{
  flex:1;border:none;background:transparent;color:var(--ink);outline:none;font-size:0.95rem;
}
.search-input-wrap input::placeholder{color:var(--ink-faint);}
.filter-toggle{
  flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:10px 14px;color:var(--ink-soft);font-size:0.85rem;font-weight:600;cursor:pointer;
}
.filter-toggle.active{border-color:var(--teal);color:var(--teal);}

.filters-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;
  display:flex;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow);
}
.filter-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px;}
.filter-field label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);font-weight:700;}
select,.text-input,textarea{
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--ink);
  padding:9px 10px;font-size:0.9rem;width:100%;
}
select:focus,.text-input:focus,textarea:focus{border-color:var(--teal);}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);border-radius:999px;
  padding:6px 12px;font-size:0.8rem;font-weight:600;cursor:pointer;
}
.chip.active{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}

.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
.cat-pill{
  flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-soft);border-radius:999px;padding:7px 13px;font-size:0.82rem;font-weight:600;cursor:pointer;white-space:nowrap;
}
.cat-pill.active{background:var(--ink);border-color:var(--ink);color:var(--bg);}

.section-heading{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px;}
.section-heading h2{font-size:1.15rem;}
.section-heading .count{font-size:0.8rem;color:var(--ink-faint);font-variant-numeric:tabular-nums;}

.grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
@media (min-width:960px){.grid{grid-template-columns:1fr 1fr 1fr;}}

.card{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:6px;
  box-shadow:var(--shadow);cursor:pointer;overflow:hidden;
  -webkit-mask-image: radial-gradient(circle 9px at calc(100% - 20px) 0, transparent 98%, #000 100%);
  mask-image: radial-gradient(circle 9px at calc(100% - 20px) 0, transparent 98%, #000 100%);
  display:flex;flex-direction:column;
}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.badge{
  display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);color:var(--ink-soft);
  border-radius:999px;padding:3px 9px;font-size:0.72rem;font-weight:700;white-space:nowrap;
}
.badge-demo{background:var(--surface-2);color:var(--ink-faint);border:1px dashed var(--border);}
.card h3{font-size:1.02rem;font-weight:700;line-height:1.3;}
.card .provider{font-size:0.82rem;color:var(--ink-soft);}
.card .desc{font-size:0.85rem;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;}
.rating{display:flex;align-items:center;gap:5px;font-size:0.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.rating .stars{color:var(--gold-fill);letter-spacing:1px;}

function mapResenaRow(row){
  var u = row.usuarios || {};
  return { id: row.id, autorId: row.autor_id, autorNombre: ((u.nombre||'')+' '+(u.apellido||'')).trim(),
    puntuacion: row.puntuacion, comentario: row.comentario, fecha: row.created_at };
}
function mapServicioRow(row){
  var u = row.usuarios || {};
  return {
    id: row.id, autorId: row.autor_id, autorNombre: ((u.nombre||'')+' '+(u.apellido||'')).trim(), autorTelefono: u.telefono||'',

  if (res.error || !res.data) return null;
  return mapUsuarioRow(res.data);

  try { localStorage.removeItem('ec_session_v2'); } catch(e){}
}
function handleSessionError(err){
  if (isSessionError(err)){
    identity = null;
    sessionToken = null;
    clearSession();
    toast('Tu sesión expiró, inicia sesión de nuevo.');
    return true;
  }
  return false;
}

function toast(msg){
  var el = document.getElementById('ec-toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'ec-toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.display = 'none'; }, 3200);
}

async function refreshServicios(){
  STATE.servicios = await loadServicios();
}

function visibleServicios(){
  var list = STATE.servicios.concat(DEMO_SERVICIOS).filter(function(s){ return s.activo !== false; });
  if (ui.fProyecto !== 'all') list = list.filter(function(s){ return String(s.proyectoId) === ui.fProyecto; });
  if (ui.fEtapa) list = list.filter(function(s){ return String(s.etapa) === ui.fEtapa; });
  if (ui.fCategoria) list = list.filter(function(s){ return String(s.categoriaId) === String(ui.fCategoria); });
  if (ui.fPrecio){
    var lo=0, hi=Infinity;
    if (ui.fPrecio==='0-50'){ lo=0; hi=50; }
    else if (ui.fPrecio==='50-100'){ lo=50; hi=100; }
    else if (ui.fPrecio==='100-200'){ lo=100; hi=200; }
    else if (ui.fPrecio==='200+'){ lo=200; hi=Infinity; }
    list = list.filter(function(s){ return s.precioMin <= hi && s.precioMax >= lo; });
  }
  if (ui.fRating){
    list = list.filter(function(s){ return avgRating(s) >= ui.fRating; });
  }
  if (ui.q && ui.q.trim()){
    var q = ui.q.trim().toLowerCase();
    list = list.filter(function(s){
      return (s.titulo+' '+s.descripcion+' '+s.autorNombre).toLowerCase().indexOf(q) !== -1;
    });
  }
  list.sort(function(a,b){
    if (!!a.demo !== !!b.demo) return a.demo ? 1 : -1;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });
  return list;
}

function cardHtml(s){
  var cat = catById(s.categoriaId);
  var rating = avgRating(s);
  var priceTxt = s.precioMin === s.precioMax ? fmtMoney(s.precioMin) : fmtMoney(s.precioMin)+' – '+fmtMoney(s.precioMax);
  return '<div class="card" data-action="open" data-id="'+s.id+'">'+
    '<div class="card-body">'+
      '<div class="card-top">'+
        '<span class="badge">'+cat.icono+' '+esc(cat.nombre)+'</span>'+
        (s.demo ? '<span class="badge badge-demo">Ejemplo</span>' : '')+
      '</div>'+
      '<h3>'+esc(s.titulo)+'</h3>'+
      '<div class="provider">por '+esc(s.autorNombre)+' · '+esc(proyById(s.proyectoId).nombre.replace('Vive Hogar ',''))+(s.etapa?', Etapa '+esc(s.etapa):'')+'</div>'+
      '<div class="desc">'+esc(s.descripcion)+'</div>'+
      '<div class="card-foot">'+
        '<span class="rating"><span class="stars">'+starsRow(rating)+'</span> '+(rating? rating.toFixed(1):'—')+' ('+s.resenas.length+')</span>'+
        '<span class="price">'+priceTxt+'</span>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function houseMarkSvg(){
  return '<img class="brand-mark" src="' + ICON_MARK_DATAURI + '" alt="" width="52" height="27" />';
}

function renderHeader(){
  return '<div class="header"><div class="header-row">'+
    '<div class="brand">'+houseMarkSvg()+
      '<div class="brand-text"><span class="brand-name"><span class="n1">Vive</span><span class="n2">Hogar</span><span class="n3">Conecta</span></span><span class="brand-tag">Marketplace vecinal</span></div>'+
    '</div>'+
    '<div class="proyecto-switch">'+
      '<button type="button" data-action="set-proyecto" data-value="all" class="'+(ui.fProyecto==='all'?'active':'')+'">Todos</button>'+
      '<button type="button" data-action="set-proyecto" data-value="1" class="'+(ui.fProyecto==='1'?'active':'')+'">Castilla</button>'+
      '<button type="button" data-action="set-proyecto" data-value="2" class="'+(ui.fProyecto==='2'?'active':'')+'">Sullana</button>'+
    '</div>'+
  '</div></div>';
}

function renderTabbar(){
  var tabs = [
    {id:'home', icon:'🏠', label:'Inicio'},
    {id:'publicar', icon:'➕', label:'Publicar'},
    {id:'mios', icon:'🗂️', label:'Mis servicios'},
    {id:'perfil', icon:'👤', label:'Perfil'}
  ];
  return '<nav class="tabbar">'+tabs.map(function(t){
    return '<button type="button" class="tab-btn'+(ui.view===t.id?' active':'')+'" data-action="nav" data-value="'+t.id+'">'+
      '<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span></button>';
  }).join('')+'</nav>';
}

function etapaPromptHtml(){
  var e = ui.etapaPromptErrors || {};
  return '<div class="identity-card" style="margin-bottom:16px;">'+
    '<h3 style="margin-bottom:4px;">¿En qué etapa vives?</h3>'+
    '<p style="font-size:0.85rem;color:var(--ink-soft);margin-bottom:16px;">Así te mostramos primero los servicios de tus vecinos más cercanos. Lo puedes cambiar cuando quieras desde Filtros.</p>'+
    '<form data-form="etapa-prompt">'+
      '<div class="form-row">'+
        '<div class="form-field"><label>Proyecto</label><select name="proyectoId">'+
          PROYECTOS.map(function(p){ return '<option value="'+p.id+'">'+esc(p.nombre)+'</option>'; }).join('')+
        '</select></div>'+
        '<div class="form-field"><label>Etapa</label><input class="text-input" type="number" min="1" max="99" name="etapa" placeholder="Ej. 5" />'+(e.etapa?'<span class="err">'+esc(e.etapa)+'</span>':'')+'</div>'+
      '</div>'+
      '<button type="submit" class="btn btn-primary btn-block">Ver servicios de mi etapa</button>'+
    '</form>'+
    '<button type="button" class="btn btn-ghost btn-block" style="margin-top:8px;" data-action="skip-etapa-prompt">Ver todo el marketplace</button>'+
  '</div>';
}

function renderHome(){
  var list = visibleServicios();
  var greeting = identity && identity.nombre ? '¡Hola, '+esc(identity.nombre.split(' ')[0])+'!' : 'Bienvenido a ViveHogarConecta';
  var html = '<h2 style="margin-bottom:12px;">'+greeting+'</h2>';

  if (ui.showEtapaPrompt){
    html += etapaPromptHtml();
  }

  if (!identity && !ui.showEtapaPrompt){
    html += '<div class="onboard-banner">'+
      '<div class="txt"><strong>Ofrece o encuentra servicios sin salir del proyecto.</strong> Crea tu cuenta para publicar y dejar reseñas.</div>'+
      '<button type="button" class="btn btn-teal btn-sm" data-action="nav" data-value="perfil">Empezar</button>'+
    '</div>';
  }

  if (!ui.showEtapaPrompt && (ui.fProyecto !== 'all' || ui.fEtapa)){
    var scopeParts = [];
    if (ui.fProyecto !== 'all') scopeParts.push(proyById(parseInt(ui.fProyecto,10)).nombre.replace('Vive Hogar ',''));
    if (ui.fEtapa) scopeParts.push('Etapa '+esc(ui.fEtapa));
    html += '<div style="font-size:0.82rem;color:var(--ink-soft);margin-bottom:10px;">Mostrando: <strong>'+scopeParts.join(', ')+'</strong> · '+
      '<button type="button" style="background:none;border:none;color:var(--teal);font-weight:700;font-size:0.82rem;cursor:pointer;padding:0;" data-action="toggle-filters">cambiar</button></div>';
  }

  html += '<div class="search-row">'+
    '<div class="search-input-wrap">'+svgSearch()+
      '<input id="ec-search" type="text" placeholder="Busca un servicio, ej. plomería, tutoría..." value="'+esc(ui.q)+'" data-action="search" />'+
    '</div>'+
    '<button type="button" class="filter-toggle'+(ui.showFilters?' active':'')+'" data-action="toggle-filters">Filtros</button>'+
  '</div>';

  html += '<div class="cat-scroll">'+
    '<button type="button" class="cat-pill'+(!ui.fCategoria?' active':'')+'" data-action="set-cat" data-value="">Todas</button>'+
    catPillsHtml(ui.fCategoria)+
  '</div>';

  if (ui.showFilters){
    html += '<div class="filters-panel">'+
      '<div class="filter-field"><label>Etapa</label><div style="display:flex;gap:6px;align-items:center;">'+
        '<input id="ec-etapa-filter" class="text-input" style="max-width:80px;" type="number" min="1" max="99" placeholder="N°" value="'+esc(ui.fEtapa)+'" />'+
        '<button type="button" class="chip'+(!ui.fEtapa?' active':'')+'" data-action="set-etapa" data-value="">Todas</button>'+
      '</div></div>'+
      '<div class="filter-field"><label>Precio</label><div class="chip-row">'+
        ['', '0-50','50-100','100-200','200+'].map(function(p){
          var lbl = p===''?'Cualquiera':(p==='200+'?'S/200+':'S/ '+p);
          return '<button type="button" class="chip'+(ui.fPrecio===p?' active':'')+'" data-action="set-precio" data-value="'+p+'">'+lbl+'</button>';
        }).join('')+
      '</div></div>'+
      '<div class="filter-field"><label>Calificación</label><div class="chip-row">'+
        [0,3,4].map(function(r){
          var lbl = r===0?'Cualquiera':r+'★ o más';
          return '<button type="button" class="chip'+(ui.fRating===r?' active':'')+'" data-action="set-rating" data-value="'+r+'">'+lbl+'</button>';
        }).join('')+
      '</div></div>'+
    '</div>';
  }

  html += '<div class="section-heading"><h2>Servicios</h2><span class="count">'+list.length+' resultado'+(list.length===1?'':'s')+'</span></div>';

  if (!list.length){
    html += '<div class="empty-state"><div class="icon">🔍</div><h3>No encontramos servicios</h3><p>Prueba con otra categoría o palabra de búsqueda.</p></div>';
  } else {
    html += '<div class="grid">'+list.map(cardHtml).join('')+'</div>';
  }
  return html;
}

function renderDetalle(){
  var s = findServicioById(ui.selectedId);
  if (!s){
    ui.view = 'home';
    return renderHome();
  }
  var cat = catById(s.categoriaId);
  var rating = avgRating(s);
  var priceTxt = s.precioMin === s.precioMax ? fmtMoney(s.precioMin) : 'Desde '+fmtMoney(s.precioMin)+' hasta '+fmtMoney(s.precioMax);
  var isOwner = identity && s.autorId === identity.id;
  var alreadyReviewed = identity && s.resenas.some(function(r){ return r.autorId === identity.id; });

  var html = '<div class="back-row"><button type="button" class="back-btn" data-action="nav" data-value="home">← Volver</button></div>';
  html += '<div class="detail-photo">'+cat.icono+'</div>';
  html += '<div class="detail-head">';
  html += '<div class="meta-row"><span class="badge">'+cat.icono+' '+esc(cat.nombre)+'</span>'+(s.demo?'<span class="badge badge-demo">Ejemplo</span>':'')+'</div>';
  html += '<h1>'+esc(s.titulo)+'</h1>';
  html += '<div class="rating" style="margin-top:6px;"><span class="stars">'+starsRow(rating)+'</span> '+(rating?rating.toFixed(1):'Sin calificar')+' ('+s.resenas.length+' reseña'+(s.resenas.length===1?'':'s')+')</div>';
  html += '</div>';

  html += '<div class="panel"><h4>Ofrecido por</h4><div class="provider-row">'+
    '<div class="avatar">'+esc((s.autorNombre||'?').charAt(0).toUpperCase())+'</div>'+
    '<div><div class="provider-name">'+esc(s.autorNombre)+'</div><div class="provider-sub">'+esc(proyById(s.proyectoId).nombre)+(s.etapa?' · Etapa '+esc(s.etapa):'')+'</div></div>'+
  '</div></div>';

  html += '<div class="panel"><h4>Descripción</h4><p style="font-size:0.92rem;color:var(--ink-soft);">'+esc(s.descripcion)+'</p></div>';
  html += '<div class="panel"><h4>Precio</h4><p style="font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;">'+priceTxt+'</p></div>';

  if (s.demo){
    html += '<div class="demo-callout">📌 Este es un servicio de ejemplo para mostrar cómo funciona ViveHogarConecta. No tiene un contacto real — ¡publica el tuyo!</div>';
  } else {
    var msg = 'Hola, vi tu servicio "'+s.titulo+'" en ViveHogarConecta. ¿Sigue disponible?';
    html += '<a class="wa-btn" href="'+waLink(s.autorTelefono, msg)+'" target="_blank" rel="noopener">'+svgWa()+' Contactar por WhatsApp</a>';
  }
  html += '<a class="maps-btn" href="'+mapsUrl(s)+'" target="_blank" rel="noopener">'+svgPin()+' Cómo llegar hasta ahí</a>';
  if (!s.direccion) html += '<p style="font-size:0.75rem;color:var(--ink-faint);margin-top:-10px;margin-bottom:16px;text-align:center;">Ubicación aproximada — este vecino no dejó una referencia exacta.</p>';

  html += '<div class="panel"><h4>Reseñas ('+s.resenas.length+')</h4>';
  if (!s.resenas.length){
    html += '<p style="font-size:0.88rem;color:var(--ink-faint);">Todavía no hay reseñas.</p>';
  } else {
    html += s.resenas.slice().reverse().map(function(r){
      return '<div class="review"><div class="review-head"><span class="review-author">'+esc(r.autorNombre)+'</span><span class="review-date">'+fmtDate(r.fecha)+'</span></div>'+
        '<div class="stars">'+starsRow(r.puntuacion)+'</div>'+

  else if (ui.view === 'perfil') body = renderPerfil();
  else body = renderHome();

  var html = renderHeader() + '<div class="main">'+body+'</div>' + renderTabbar();

  if (ui.view === 'home' && lastFocusedInputId){

    if (input){
      var pos = input.selectionStart;
      input.focus();
      try{ input.setSelectionRange(pos,pos); }catch(e){}

  if (ui.view === 'detalle'){

    if (starsWrap) paintStars(starsWrap, parseInt(starsWrap.getAttribute('data-value'),10) || 0);
  }

function render(){ renderApp(); }

function paintStars(wrap, val){
  wrap.setAttribute('data-value', val);
  var btns = wrap.querySelectorAll('button');
  btns.forEach(function(b,i){
    if (i < val) b.classList.add('filled'); else b.classList.remove('filled');
  });
}

function validateServicioForm(fd){
  var errors = {};
  var titulo = (fd.get('titulo')||'').trim();
  var descripcion = (fd.get('descripcion')||'').trim();
  var precioMin = parseFloat(fd.get('precioMin'));
  var precioMax = parseFloat(fd.get('precioMax'));
  if (titulo.length < 8) errors.titulo = 'Escribe un título más descriptivo (mínimo 8 caracteres).';
  if (descripcion.length < 20) errors.descripcion = 'Cuéntanos un poco más (mínimo 20 caracteres).';
  if (!precioMin || precioMin <= 0) errors.precioMin = 'Ingresa un precio válido.';
  if (!precioMax || precioMax <= 0) errors.precioMax = 'Ingresa un precio válido.';
  if (precioMin && precioMax && precioMin > precioMax) errors.precioMax = 'Debe ser mayor o igual al precio mínimo.';
  return errors;
}

document.addEventListener('click', async function(ev){
  var starBtn = ev.target.closest('#resena-stars button');
  if (starBtn){
    paintStars(document.getElementById('resena-stars'), parseInt(starBtn.getAttribute('data-star'),10));
    return;
  }
  var t = ev.target.closest('[data-action]');
  if (!t) return;
  var action = t.getAttribute('data-action');
  var value = t.getAttribute('data-value');

  if (action === 'nav'){
    ui.view = value;
    ui.formErrors = {};
    ui.authErrors = {};
    ui.perfilErrors = {};
    ui.passwordErrors = {};
    ui.showPasswordChange = false;
    if (value !== 'publicar') ui.editingId = null;
    window.scrollTo(0,0);
    render();
  } else if (action === 'set-authmode'){
    ui.authMode = value;
    ui.authErrors = {};
    render();
  } else if (action === 'toggle-password-change'){
    ui.showPasswordChange = !ui.showPasswordChange;
    ui.passwordErrors = {};
    render();
  } else if (action === 'open'){
    ui.selectedId = t.getAttribute('data-id');
    ui.view = 'detalle';
    window.scrollTo(0,0);
    render();
  } else if (action === 'set-proyecto'){
    ui.fProyecto = value;
    render();
  } else if (action === 'set-cat'){
    ui.fCategoria = ui.fCategoria === value ? '' : value;
    render();
  } else if (action === 'set-precio'){
    ui.fPrecio = ui.fPrecio === value ? '' : value;
    render();
  } else if (action === 'set-rating'){
    ui.fRating = ui.fRating === Number(value) ? 0 : Number(value);
    render();
  } else if (action === 'set-etapa'){
    ui.fEtapa = value;
    render();
  } else if (action === 'skip-etapa-prompt'){
    skipLocalPref();
    ui.showEtapaPrompt = false;
    render();
  } else if (action === 'toggle-filters'){
    ui.showFilters = !ui.showFilters;
    render();
  } else if (action === 'edit-svc'){
    ui.editingId = t.getAttribute('data-id');
    ui.view = 'publicar';
    ui.formErrors = {};
    window.scrollTo(0,0);
    render();
  } else if (action === 'del-svc'){
    var idDel = t.getAttribute('data-id');
    if (confirm('¿Seguro que quieres borrar este servicio? Esta acción no se puede deshacer.')){
      var del = await sb.rpc('ec_borrar_servicio', { p_token: sessionToken, p_servicio_id: idDel });
      if (del.error){ if (!handleSessionError(del.error)) toast('No se pudo borrar. Intenta de nuevo.'); }
      else { toast('Servicio borrado.'); ui.view = 'mios'; }
      await refreshServicios();
      render();
    }
  } else if (action === 'del-resena'){
    var sidR = t.getAttribute('data-id'), ridR = t.getAttribute('data-rid');
    if (confirm('¿Borrar tu reseña?')){
      var delR = await sb.rpc('ec_borrar_resena', { p_token: sessionToken, p_resena_id: ridR });
      if (delR.error){ if (!handleSessionError(delR.error)) toast('No se pudo borrar. Intenta de nuevo.'); }
      else { toast('Reseña borrada.'); ui.view = 'detalle'; ui.selectedId = sidR; }
      await refreshServicios();
      render();
    }
  } else if (action === 'logout'){
    if (confirm('¿Cerrar sesión en este dispositivo?')){
      identity = null;
      sessionToken = null;
      clearSession();
      ui.view = 'home';
      render();
      toast('Sesión cerrada.');
    }
  }
});

document.addEventListener('submit', async function(ev){
  var form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  var kind = form.getAttribute('data-form');
  var fd = new FormData(form);

  if (kind === 'registro'){
    var nombre = (fd.get('nombre')||'').trim();
    var apellido = (fd.get('apellido')||'').trim();
    var telefono = fd.get('telefono')||'';
    var proyectoId = parseInt(fd.get('proyectoId'),10) || 1;
    var etapaVal = fd.get('etapa')||'';
    var direccion = (fd.get('direccion')||'').trim();
    var password = fd.get('password')||'';
    var password2 = fd.get('password2')||'';
    var telDigits = digitsOnly(telefono);
    var errs = {};
    if (nombre.length < 2) errs.nombre = 'Ingresa tu nombre.';
    if (apellido.length < 2) errs.apellido = 'Ingresa tu apellido.';
    if (!isValidPeruCel(telefono)) errs.telefono = 'Ingresa 9 dígitos válidos (empieza con 9).';
    if (!isValidEtapa(etapaVal)) errs.etapa = 'Ingresa el número de tu etapa.';
    if (password.length < 6) errs.password = 'Mínimo 6 caracteres.';
    if (password !== password2) errs.password2 = 'Las contraseñas no coinciden.';
    if (Object.keys(errs).length){ ui.authErrors = errs; render(); return; }
    var etapaNum = parseInt(etapaVal,10);

    ui.authBusy = true; render();
    var regRes = await sb.rpc('ec_registrar', {
      p_nombre: nombre, p_apellido: apellido, p_telefono: telDigits, p_proyecto_id: proyectoId,
      p_etapa: etapaNum, p_direccion: direccion, p_password: password
    });
    ui.authBusy = false;
    if (regRes.error){
      var msg = (regRes.error.message || '').toLowerCase();
      ui.authErrors = /telefono_duplicado/.test(msg) ? {telefono:'Ya existe una cuenta con este WhatsApp. Inicia sesión.'} : {telefono:'No se pudo crear la cuenta. Intenta de nuevo.'};
      render(); return;
    }
    var newRow = regRes.data[0];
    identity = { id:newRow.id, nombre:nombre, apellido:apellido, telefono:telDigits, proyectoId:proyectoId, etapa:etapaNum, direccion:direccion };
    sessionToken = newRow.token;
    saveSession(newRow.id, newRow.token);
    ui.authErrors = {};
    ui.fProyecto = String(proyectoId);
    ui.fEtapa = String(etapaNum);
    ui.showEtapaPrompt = false;
    ui.view = (ui.view === 'perfil') ? 'perfil' : 'publicar';
    toast('¡Cuenta creada! Ya iniciaste sesión.');
    render();
    return;
  }

  if (kind === 'etapa-prompt'){
    var epProyectoId = parseInt(fd.get('proyectoId'),10) || 1;
    var epEtapa = fd.get('etapa')||'';
    if (!isValidEtapa(epEtapa)){ ui.etapaPromptErrors = {etapa:'Ingresa el número de tu etapa.'}; render(); return; }
    ui.etapaPromptErrors = {};
    var epEtapaNum = parseInt(epEtapa,10);
    saveLocalPref(epProyectoId, epEtapaNum);
    ui.fProyecto = String(epProyectoId);
    ui.fEtapa = String(epEtapaNum);
    ui.showEtapaPrompt = false;
    toast('Listo, te mostramos primero tu etapa.');
    render();
    return;
  }

  if (kind === 'login'){
    var lTelefono = fd.get('telefono')||'';
    var lPassword = fd.get('password')||'';
    var lDigits = digitsOnly(lTelefono);
    if (!isValidPeruCel(lTelefono)){ ui.authErrors = {telefono:'Ingresa un WhatsApp válido (9 dígitos, empieza con 9).'}; render(); return; }
    ui.authBusy = true; render();
    var loginRes = await sb.rpc('ec_login', { p_telefono: lDigits, p_password: lPassword });
    if (loginRes.error){
      ui.authBusy = false;
      ui.authErrors = {password:'Teléfono o contraseña incorrectos.'};
      render(); return;
    }
    var loginRow = loginRes.data[0];
    var row = await loadUsuario(loginRow.id);
    ui.authBusy = false;
    if (!row){
      ui.authErrors = {telefono:'No se pudo cargar tu perfil. Intenta de nuevo.'};
      render();
      return;
    }
    identity = row;
    sessionToken = loginRow.token;
    saveSession(loginRow.id, loginRow.token);
    ui.authErrors = {};
    ui.fProyecto = String(row.proyectoId);
    ui.fEtapa = String(row.etapa||'');
    ui.showEtapaPrompt = false;
    toast('¡Bienvenido de nuevo, '+row.nombre+'!');
    render();
    return;
  }

  if (kind === 'perfil'){
    var pNombre = (fd.get('nombre')||'').trim();
    var pApellido = (fd.get('apellido')||'').trim();
    var pTelefono = fd.get('telefono')||'';
    var pProyectoId = parseInt(fd.get('proyectoId'),10) || 1;
    var pEtapaVal = fd.get('etapa')||'';
    var pDireccion = (fd.get('direccion')||'').trim();
    var pDigits = digitsOnly(pTelefono);
    var perrs = {};
    if (pNombre.length < 2) perrs.nombre = 'Ingresa tu nombre.';
    if (pApellido.length < 2) perrs.apellido = 'Ingresa tu apellido.';
    if (!isValidPeruCel(pTelefono)) perrs.telefono = 'Ingresa 9 dígitos válidos (empieza con 9).';
    if (!isValidEtapa(pEtapaVal)) perrs.etapa = 'Ingresa el número de tu etapa.';
    if (Object.keys(perrs).length){ ui.perfilErrors = perrs; render(); return; }
    var pEtapaNum = parseInt(pEtapaVal,10);
    var upd = await sb.rpc('ec_actualizar_perfil', {
      p_token: sessionToken, p_nombre: pNombre, p_apellido: pApellido, p_telefono: pDigits,
      p_proyecto_id: pProyectoId, p_etapa: pEtapaNum, p_direccion: pDireccion
    });
    if (upd.error){
      if (handleSessionError(upd.error)){ render(); return; }
      var umsg = (upd.error.message||'').toLowerCase();
      ui.perfilErrors = /telefono_duplicado/.test(umsg) ? {telefono:'Ese WhatsApp ya está en uso por otra cuenta.'} : {nombre:'No se pudo guardar. Intenta de nuevo.'};
      render(); return;
    }
    identity = { id:identity.id, nombre:pNombre, apellido:pApellido, telefono:pDigits, proyectoId:pProyectoId, etapa:pEtapaNum, direccion:pDireccion };
    ui.perfilErrors = {};
    ui.fProyecto = String(pProyectoId);
    ui.fEtapa = String(pEtapaNum);
    toast('Datos actualizados.');
    await refreshServicios();
    render();
    return;
  }

  if (kind === 'password'){
    var nueva = fd.get('nueva')||'';
    var nueva2 = fd.get('nueva2')||'';
    var werrs = {};
    if (nueva.length < 6) werrs.nueva = 'Mínimo 6 caracteres.';
    if (nueva !== nueva2) werrs.nueva2 = 'Las contraseñas no coinciden.';
    if (Object.keys(werrs).length){ ui.passwordErrors = werrs; render(); return; }
    var pwRes = await sb.rpc('ec_cambiar_password', { p_token: sessionToken, p_nueva: nueva });
    if (pwRes.error){
      if (handleSessionError(pwRes.error)){ render(); return; }
      ui.passwordErrors = {nueva:'No se pudo actualizar. Intenta de nuevo.'}; render(); return;
    }
    ui.passwordErrors = {};
    ui.showPasswordChange = false;
    toast('Contraseña actualizada.');
    render();
    return;
  }

  if (kind === 'servicio'){
    var errors = validateServicioForm(fd);
    ui.formErrors = errors;
    if (Object.keys(errors).length){ render(); return; }
    var editId = form.getAttribute('data-id');
    var titulo = (fd.get('titulo')||'').trim();
    var descripcion = (fd.get('descripcion')||'').trim();
    var categoriaId = parseInt(fd.get('categoriaId'),10);
    var precioMin = parseFloat(fd.get('precioMin'));
    var precioMax = parseFloat(fd.get('precioMax'));
    var svcProyectoId = parseInt(fd.get('proyectoId'),10);
    if (editId){
      var updS = await sb.rpc('ec_editar_servicio', {
        p_token: sessionToken, p_servicio_id: editId, p_titulo: titulo, p_descripcion: descripcion,
        p_categoria_id: categoriaId, p_precio_min: precioMin, p_precio_max: precioMax, p_proyecto_id: svcProyectoId
      });
      if (updS.error){
        if (handleSessionError(updS.error)){ render(); return; }
        toast('No se pudo guardar. Intenta de nuevo.'); render(); return;
      }
      toast('Servicio actualizado.');
      ui.view = 'mios';
      await refreshServicios();
      render();
    } else {
      var insS = await sb.rpc('ec_crear_servicio', {
        p_token: sessionToken, p_titulo: titulo, p_descripcion: descripcion,
        p_categoria_id: categoriaId, p_precio_min: precioMin, p_precio_max: precioMax, p_proyecto_id: svcProyectoId
      });
      if (insS.error){
        if (handleSessionError(insS.error)){ render(); return; }
        toast('No se pudo publicar. Intenta de nuevo.'); render(); return;
      }
      toast('¡Tu servicio ya está publicado!');
      ui.view = 'detalle';
      ui.selectedId = insS.data;
      await refreshServicios();
      render();
    }
    return;
  }

  if (kind === 'resena'){
    var sid = form.getAttribute('data-id');
    var starsWrap = document.getElementById('resena-stars');
    var puntuacion = parseInt(starsWrap.getAttribute('data-value'),10) || 0;
    var comentario = (fd.get('comentario')||'').trim();
    if (puntuacion < 1){ ui.formErrors = {resena:'Selecciona una calificación de estrellas.'}; render(); return; }
    if (comentario.length < 5){ ui.formErrors = {resena:'Escribe un comentario un poco más largo.'}; render(); return; }
    var insR = await sb.rpc('ec_crear_resena', { p_token: sessionToken, p_servicio_id: sid, p_puntuacion: puntuacion, p_comentario: comentario });
    if (insR.error){
      if (handleSessionError(insR.error)){ render(); return; }
      ui.formErrors = {resena:'No se pudo enviar tu reseña. Intenta de nuevo.'}; render(); return;
    }
    ui.formErrors = {};
    toast('¡Gracias por tu reseña!');
    ui.view = 'detalle';
    ui.selectedId = sid;
    await refreshServicios();
    render();
    return;
  }
});

async function init(){
  render();
  try{
    var saved = JSON.parse(localStorage.getItem('ec_session_v2'));
    if (saved && saved.userId && saved.token){
      var row = await loadUsuario(saved.userId);
      if (row){
        identity = row;
        sessionToken = saved.token;
        ui.fProyecto = String(row.proyectoId);
        ui.fEtapa = String(row.etapa||'');
        ui.showEtapaPrompt = false;
      } else {
        clearSession();
      }
    }
  }catch(e){ console.error(e); }
  await refreshServicios();
  loading = false;
  render();
}

init();

})();
</script>
</body>
</html>

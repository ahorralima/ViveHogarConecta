<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mi vivienda 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe6f5;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;color:#1f2937;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.btn{border:0;border-radius:22px;padding:10px 16px;font-size:15px;font-weight:600;background:#fff;color:#1f2937;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.btn.on{background:#e8590c;color:#fff}
#top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#title{background:rgba(255,255,255,.9);border-radius:14px;padding:7px 12px;font-size:13px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#title b{display:block;font-size:15px}
#title{white-space:nowrap;margin:0 8px;flex:1;max-width:180px}
#top .btn{white-space:nowrap}
#mini{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top));width:104px;height:104px;background:rgba(255,255,255,.85);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#stick{position:fixed;left:22px;bottom:calc(30px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.8);touch-action:none;display:none}
#knob{position:absolute;left:37px;top:37px;width:46px;height:46px;border-radius:50%;background:rgba(232,89,12,.85);box-shadow:0 2px 6px rgba(0,0,0,.3)}
body.touch #stick{display:block}
body.panel #stick{display:none}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;transition:opacity .6s}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:58%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.3);padding:14px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
body.panel #panel{transform:none}
#panel h3{margin:12px 0 6px;font-size:14px}
#panel h3:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #e5e7eb;padding:0}
.sw.sel{border-color:#e8590c}
.chip{border:1px solid #d1d5db;background:#f9fafb;border-radius:16px;padding:7px 12px;font-size:14px}
.ex{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.ex input{width:22px;height:22px}
@media (min-width:700px){#panel{left:auto;right:12px;bottom:12px;width:340px;max-height:80%;border-radius:16px}}
#buscar{width:100%;padding:11px 14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#f9fafb}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;gap:6px;width:calc(100% - 24px);max-width:420px;text-align:center}
.bar #pname,.bar #sname{background:rgba(255,255,255,.92);border-radius:12px;padding:4px 12px;font-size:14px;font-weight:700}
#pmsg{font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.brow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.brow .btn{padding:9px 13px;font-size:14px}
.btn:disabled{opacity:.45}
body.placing #pbar,body.selecting #sbar{display:flex}
#ret{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);display:none;pointer-events:none}
body.placing #ret{display:block}
body.placing #hint{display:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fff;padding:30px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <a class="btn" id="back" href="../" onclick="if(history.length>1){history.back();return false}" style="text-decoration:none;padding:9px 13px">←</a>
  <div id="title"><b>Mi vivienda</b><span class="sub">Módulo A · 25 m²</span></div>
  <button class="btn" id="bpanel">🎨 Colores</button>
</div>
<canvas id="mini" width="208" height="208"></canvas>
<div id="ret"></div>
<div class="bar" id="pbar"><div id="pname"></div><div id="pmsg"></div><div class="brow"><button class="btn" id="pRot">⟳ Girar</button><button class="btn" id="pCancel">✕ Cancelar</button><button class="btn on" id="pOk">✓ Colocar</button></div></div>
<div class="bar" id="sbar"><div id="sname"></div><div class="brow"><button class="btn" id="sMove">✋ Mover</button><button class="btn" id="sRot">⟳ Girar</button><button class="btn" id="sDel">🗑 Borrar</button><button class="btn" id="sClose">✕</button></div></div>
<div id="stick"><div id="knob"></div></div>
<div id="hint"></div>
<div id="panel">
  <h3>Ir a</h3><div class="row" id="tp"></div>
  <h3>➕ Agregar objetos</h3>
  <input id="buscar" type="search" placeholder="Buscar: espejo, sofá, planta…" autocomplete="off">
  <div class="row" id="res" style="margin-top:8px"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span id="mycount" style="font-size:13px;color:#6b7280"></span><button class="chip" id="clearall" style="display:none">Borrar todos</button></div>
  <h3>Hora del día</h3><div class="row" id="sunrow"></div>
  <h3>Paredes</h3><div class="row" id="c-wall"></div>
  <h3>Techo</h3><div class="row" id="c-ceil"></div>
  <h3>Piso</h3><div class="row" id="c-floor"></div>
  <h3>Cama</h3><div class="row" id="c-bed"></div>
  <h3>Muebles opcionales</h3><div id="extras"></div>
</div>
<div id="err">No se pudo iniciar el 3D en este dispositivo.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
var $=function(i){return document.getElementById(i)};
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');

/* ---------- escena ---------- */
var cv=$('c');
var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9d4f0);
var cam=new THREE.PerspectiveCamera(72,1,0.05,60);
cam.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xffffff,0xf0ece4,1.0));
var hemi=scene.children[0];
var sun=new THREE.DirectionalLight(0xfff1d8,0.6);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
var sc=sun.shadow.camera;sc.left=-7;sc.right=7;sc.top=7;sc.bottom=-7;sc.near=1;sc.far=60;
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.025;
sun.target.position.set(2.5,0,2.5);scene.add(sun);scene.add(sun.target);
var SUNS={
 manana:{p:[14,12,16],c:0xffe2b8,i:0.65,h:0.85},
 mediodia:{p:[2,17,15],c:0xfff6e4,i:0.7,h:0.9},
 tarde:{p:[-14,12,16],c:0xffd2a0,i:0.65,h:0.82}
};
function setSun(k){var o=SUNS[k];sun.position.set(o.p[0]+2.5,o.p[1],o.p[2]+2.5);sun.color.setHex(o.c);sun.intensity=o.i;hemi.intensity=o.h;}
setSun('mediodia');

var H=2.4;
var M={
 wall:new THREE.MeshLambertMaterial({color:0xffffff}),
 ceil:new THREE.MeshLambertMaterial({color:0xffffff}),
 floor:new THREE.MeshLambertMaterial({color:0xc9c6c0}),
 bed:new THREE.MeshLambertMaterial({color:0x7fa6c9}),
 wood:new THREE.MeshLambertMaterial({color:0xa9825a}),
 door:new THREE.MeshLambertMaterial({color:0xb48a60}),
 white:new THREE.MeshLambertMaterial({color:0xf4f4f2}),
 cer:new THREE.MeshLambertMaterial({color:0xeef2f3}),
 steel:new THREE.MeshLambertMaterial({color:0x9aa1a6}),
 dark:new THREE.MeshLambertMaterial({color:0x2b2f33}),
 top:new THREE.MeshLambertMaterial({color:0x8d9296}),
 cab:new THREE.MeshLambertMaterial({color:0xd9d3c7}),
 glass:new THREE.MeshBasicMaterial({color:0xbfe3f5,transparent:true,opacity:.28,depthWrite:false}),
 frame:new THREE.MeshLambertMaterial({color:0x6b7075}),
 mirror:new THREE.MeshBasicMaterial({color:0xcfe4ec}),
 curtainS:new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.72,side:THREE.DoubleSide}),
 sofa:new THREE.MeshLambertMaterial({color:0x6d7f8f}),
 curt:new THREE.MeshLambertMaterial({color:0xe9dfc8}),
 lamp:new THREE.MeshBasicMaterial({color:0xfffbe8}),
 ground:new THREE.MeshLambertMaterial({color:0xc2b48f}),
 plate:new THREE.MeshLambertMaterial({color:0xe9e6df}),
 doorp:new THREE.MeshLambertMaterial({color:0xc29c72}),
 patio:new THREE.MeshLambertMaterial({color:0xb9b2a4}),
 side:new THREE.MeshLambertMaterial({color:0xcfcac0}),
 road:new THREE.MeshLambertMaterial({color:0x585c5f}),
 nb1:new THREE.MeshLambertMaterial({color:0xe8dcc4}),
 nb2:new THREE.MeshLambertMaterial({color:0xd9b9a8}),
 nb3:new THREE.MeshLambertMaterial({color:0xc4d3dc}),
 nbw:new THREE.MeshLambertMaterial({color:0x3b4650})
};
// sombras suaves "horneadas": dos mapas del plano (solo muros / muros+muebles)
var AO0=-0.06,AOS=5.12;
function mkCanvas(n){var c=document.createElement('canvas');c.width=c.height=n;return c;}
var aoWallC=mkCanvas(512),aoFloorC=mkCanvas(512);
function aoTex(c){var t=new THREE.CanvasTexture(c);t.generateMipmaps=false;t.minFilter=t.magFilter=THREE.LinearFilter;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;}
var aoWallT=aoTex(aoWallC),aoFloorT=aoTex(aoFloorC);
function patchAO(mat,tex,mode){
 mat.onBeforeCompile=function(sh){
  sh.uniforms.aoTex={value:tex};sh.uniforms.uMode={value:mode};
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vWN;')
   .replace('#include <begin_vertex>','#include <begin_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;vWN=normalize(mat3(modelMatrix)*objectNormal);');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vWN;uniform sampler2D aoTex;uniform float uMode;')
   .replace('#include <dithering_fragment>','#include <dithering_fragment>\n'+
    'vec2 pp=vWP.xz+(uMode>0.5?vec2(0.0):vWN.xz*0.3);\n'+
    'float a=texture2D(aoTex,(pp-vec2(-0.06))/5.12).r;\n'+
    'if(uMode<0.5){a*=(1.0-0.12*(1.0-smoothstep(0.0,0.4,vWP.y)))*(1.0-0.1*smoothstep(1.95,2.4,vWP.y));}\n'+
    'gl_FragColor.rgb*=mix(1.0,a,0.9);');
 };
 mat.customProgramCacheKey=function(){return 'ao'+(mode>0.5?1:0);};
}
patchAO(M.wall,aoWallT,0);patchAO(M.ceil,aoWallT,2);patchAO(M.floor,aoFloorT,1);
var colliders=[]; // {x0,x1,z0,z1,grp?}
var surfaces=[],openings=[];
function box(x0,x1,y0,y1,z0,z1,mat,parent){
 var m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),mat);
 m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
 (parent||scene).add(m);if(mat===M.wall)surfaces.push(m);return m;
}
function col(x0,x1,z0,z1,grp,noao){colliders.push({x0:x0,x1:x1,z0:z0,z1:z1,grp:grp||null,noao:!!noao});}

/* ---------- muros con vanos ---------- */
// axis 'x': el muro corre en x (c0..c1), grosor en z (t0..t1). axis 'z': al revés.
function wall(axis,c0,c1,t0,t1,ops,skip){
 ops=(ops||[]).slice().sort(function(a,b){return a.a-b.a});
 function seg(a,b,y0,y1,solid){
  if(b-a<0.001)return;
  if(axis==='x'){box(a,b,y0,y1,t0,t1,M.wall);if(solid)col(a,b,t0,t1);}
  else{box(t0,t1,y0,y1,a,b,M.wall);if(solid)col(t0,t1,a,b);}
  if(y0===0&&y1===H&&b-a>0.12){ // zócalo
   var e=0.012,zh=0.08;
   if(axis==='x'){if(skip!=='lo')box(a,b,0,zh,t0-e,t0,M.wall);if(skip!=='hi')box(a,b,0,zh,t1,t1+e,M.wall);}
   else{if(skip!=='lo')box(t0-e,t0,0,zh,a,b,M.wall);if(skip!=='hi')box(t1,t1+e,0,zh,a,b,M.wall);}
  }
 }
 var pos=c0;
 ops.forEach(function(o){
  seg(pos,o.a,0,H,true);
  if(o.top<H)seg(o.a,o.b,o.top,H,false);
  if(o.sill>0)seg(o.a,o.b,0,o.sill,false);
  openings.push(axis==='x'?{x0:o.a,x1:o.b,z0:t0-0.03,z1:t1+0.03,y0:o.sill,y1:o.top}:{x0:t0-0.03,x1:t1+0.03,z0:o.a,z1:o.b,y0:o.sill,y1:o.top});
  var blocks=(o.kind==='win')||o.closed;
  if(blocks){if(axis==='x')col(o.a,o.b,t0,t1,null,true);else col(t0,t1,o.a,o.b,null,true);}
  if(o.kind==='door')doorCasing(axis,o,t0,t1);
  if(o.kind==='win')windowFrame(axis,o,t0,t1);
  if(o.closed)doorLeaf(axis,o,t0,t1);
  pos=o.b;
 });
 seg(pos,c1,0,H,true);
}
function win(a,b,sill,top){return{kind:'win',a:a,b:b,sill:sill,top:top}}
function door(a,b,closed){return{kind:'door',a:a,b:b,sill:0,top:H,closed:!!closed}}
function doorCasing(axis,o,t0,t1){
 var e=0.012,w=0.07;
 if(axis==='x'){box(o.a-w,o.a,0,H,t0-e,t1+e,M.white);box(o.b,o.b+w,0,H,t0-e,t1+e,M.white);}
 else{box(t0-e,t1+e,0,H,o.a-w,o.a,M.white);box(t0-e,t1+e,0,H,o.b,o.b+w,M.white);}
}
function windowFrame(axis,o,t0,t1){
 // alféizar
 if(axis==='x')box(o.a-.03,o.b+.03,o.sill-.03,o.sill,t0-.05,t1+.05,M.white);else box(t0-.05,t1+.05,o.sill-.03,o.sill,o.a-.03,o.b+.03,M.white);
 var tm=(t0+t1)/2,f=0.04,y0=o.sill,y1=o.top;
 function B(a,b,ya,yb,mat){ if(axis==='x')box(a,b,ya,yb,tm-.03,tm+.03,mat);else box(tm-.03,tm+.03,ya,yb,a,b,mat);}
 B(o.a,o.b,y0,y1,M.glass);
 B(o.a,o.b,y0,y0+f,M.frame);B(o.a,o.b,y1-f,y1,M.frame);
 B(o.a,o.a+f,y0,y1,M.frame);B(o.b-f,o.b,y0,y1,M.frame);
 if(o.b-o.a>0.6)B((o.a+o.b)/2-.02,(o.a+o.b)/2+.02,y0,y1,M.frame);
 o.tm=tm;
}
function doorLeaf(axis,o,t0,t1){
 var tm=(t0+t1)/2;
 var q=0.15,e=0.031;
 if(axis==='x'){[[1.3,2.15],[.2,1.2]].forEach(function(r){box(o.a+q,o.b-q,r[0],r[1],tm-e,tm+e,M.doorp);});}
 else{[[1.3,2.15],[.2,1.2]].forEach(function(r){box(tm-e,tm+e,r[0],r[1],o.a+q,o.b-q,M.doorp);});}
 if(axis==='x'){box(o.a+.01,o.b-.01,0,H-.02,tm-.025,tm+.025,M.door);box(o.b-.12,o.b-.08,.95,1.05,t0-.06,t1+.06,M.dark);}
 else{box(tm-.025,tm+.025,0,H-.02,o.a+.01,o.b-.01,M.door);box(t0-.06,t1+.06,.95,1.05,o.b-.12,o.b-.08,M.dark);}
}
function openLeaf(x0,x1,z0,z1){box(x0,x1,0,H-.02,z0,z1,M.door);}

// perímetro
wall('x',0,5,-0.05,0.05,[win(0.64,1.69,1.0,2.2),win(1.80,2.10,1.7,2.2),door(3.02,3.92,true),win(3.97,4.87,1.0,2.2)],'lo');
wall('x',0,5,5.0,5.1,[win(0.99,2.04,1.0,2.2),door(3.02,3.92,true),win(3.97,4.87,1.0,2.2)],'hi');
wall('z',0.05,5.0,0,0.1,[],'lo');
wall('z',0.05,5.0,4.9,5.0,[],'hi');
// interiores
wall('z',0.05,2.2,1.70,1.80);               // baño, lado dormitorio 2
wall('z',0.05,2.2,2.90,3.00);               // baño, lado cocina
wall('x',1.80,2.90,2.10,2.20,[door(2.20,2.90)]); // baño, puerta P-3
wall('x',0.10,2.90,2.95,3.05,[door(2.13,2.85)]); // dormitorio 1 / dormitorio 2, puerta P-2
wall('z',2.95,5.0,2.90,3.00);               // dormitorio 1 / comedor
openLeaf(2.84,2.88,1.46,2.10);              // hoja P-3 abierta
openLeaf(2.80,2.84,3.05,3.75);              // hoja P-2 abierta
var wallN=colliders.length;
// interruptores y tomacorrientes
[[3.97,4.05,1.15,1.27,4.985,5.0],[3.97,4.05,1.15,1.27,0.05,0.065],[2.0,2.08,1.15,1.27,3.05,3.065],[1.685,1.70,1.15,1.27,2.0,2.08],
 [4.4,4.5,0.3,0.4,4.985,5.0],[0.5,0.6,0.3,0.4,3.05,3.065],[0.5,0.6,0.3,0.4,2.935,2.95]].forEach(function(p){box(p[0],p[1],p[2],p[3],p[4],p[5],M.plate);});

/* ---------- pisos, techo, exterior ---------- */
function plane(x0,x1,z0,z1,y,mat,up){
 var m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),mat);
 m.rotation.x=up?-Math.PI/2:Math.PI/2;
 m.position.set((x0+x1)/2,y,(z0+z1)/2);scene.add(m);return m;
}
(function(){
 var c=mkCanvas(256),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,256,256);
 for(var i=0;i<2200;i++){g.fillStyle='rgba('+(i%2?'0,0,0':'255,255,255')+','+(0.02+Math.random()*0.04)+')';g.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*3);}
 for(i=0;i<14;i++){var x=Math.random()*256,y=Math.random()*256,gr=g.createRadialGradient(x,y,0,x,y,40+Math.random()*50);gr.addColorStop(0,'rgba(0,0,0,0.05)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);}
 var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);M.floor.map=t;
})();
surfaces.push(plane(0.1,4.9,0.05,5.0,0,M.floor,true));
// baño: cerámico con juntas
var tc=document.createElement('canvas');tc.width=tc.height=128;
(function(){var g=tc.getContext('2d');g.fillStyle='#eef2f3';g.fillRect(0,0,128,128);g.strokeStyle='#cfd8dc';g.lineWidth=3;g.strokeRect(0,0,128,128);})();
var tt=new THREE.CanvasTexture(tc);tt.wrapS=tt.wrapT=THREE.RepeatWrapping;tt.repeat.set(1.2/0.3*0.75,2.05/0.3);
surfaces.push(plane(1.80,2.90,0.05,2.10,0.003,new THREE.MeshLambertMaterial({map:tt}),true));
plane(0,5,-0.05,5.1,H,M.ceil,false);
var gr=plane(-30,35,-30,35,-0.02,M.ground,true);
(function(){
 plane(-0.35,5.35,-3.0,0,0.001,M.patio,true);
 box(-0.35,5.35,0,2.5,-3.1,-3.0,M.nb1);                 // muro del fondo del patio
 box(-6,-0.35,0,3.0,-30,40,M.nb1);box(5.35,11,0,3.0,-30,40,M.nb1); // casas vecinas

var TY={};CAT.forEach(function(c){TY[c.id]=c;});
var userRoot=new THREE.Group();scene.add(userRoot);
var userItems=[],wallBoxes=[],MAXI=40;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function makeObj(t){var g=new THREE.Group();t.build(g);g.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});return g;}
function ext(t,ry){return Math.abs(Math.sin(ry))>0.5?[t.d/2,t.w/2]:[t.w/2,t.d/2];}
function valid(t,x,y,z,ry){
 var e=ext(t,ry),x0=x-e[0],x1=x+e[0],z0=z-e[1],z1=z+e[1],i,c;
 if(x0<0.095||x1>4.905||z0<0.045||z1>5.005)return false;
 if(t.kind==='wall'){
  var y0=y-t.h/2,y1=y+t.h/2;
  if(y0<0.25||y1>2.35)return false;
  var all=openings.concat(wallBoxes);
  for(i=0;i<all.length;i++){c=all[i];
   if(x0<c.x1-0.003&&x1>c.x0+0.003&&z0<c.z1-0.003&&z1>c.z0+0.003&&y0<c.y1&&y1>c.y0)return false;}
  return true;
 }
 if(t.rug)return true;
 for(i=0;i<colliders.length;i++){c=colliders[i];if(c.grp&&!c.grp.visible)continue;
  if(x0<c.x1-0.005&&x1>c.x0+0.005&&z0<c.z1-0.005&&z1>c.z0+0.005)return false;}
 return true;
}
function register(it){
 var t=it.t,e=ext(t,it.r);
 if(t.kind==='wall'){it.box={x0:it.x-e[0],x1:it.x+e[0],z0:it.z-e[1],z1:it.z+e[1],y0:it.y-t.h/2,y1:it.y+t.h/2};wallBoxes.push(it.box);}
 else if(!t.rug){it.col={x0:it.x-e[0],x1:it.x+e[0],z0:it.z-e[1],z1:it.z+e[1],grp:null,noao:true,user:true};colliders.push(it.col);}
}
function unregister(it){
 if(it.box){wallBoxes.splice(wallBoxes.indexOf(it.box),1);it.box=null;}
 if(it.col){colliders.splice(colliders.indexOf(it.col),1);it.col=null;}
}
function addItem(t,x,y,z,r){
 var o=makeObj(t);o.position.set(x,y,z);o.rotation.y=r;userRoot.add(o);
 var it={t:t,x:x,y:y,z:z,r:r,obj:o};o.userData.item=it;userItems.push(it);register(it);return it;
}
function removeItem(it){unregister(it);userRoot.remove(it.obj);userItems.splice(userItems.indexOf(it),1);}
var LS='casa3d_items_v1';
function save(){try{localStorage.setItem(LS,JSON.stringify(userItems.map(function(i){return{t:i.t.id,x:i.x,y:i.y,z:i.z,r:i.r};})));}catch(e){}updCount();}
function load(){try{var a=JSON.parse(localStorage.getItem(LS)||'[]');a.forEach(function(d){if(TY[d.t])addItem(TY[d.t],d.x,d.y,d.z,d.r);});}catch(e){}}
// ---- apuntar ----
var rc=new THREE.Raycaster();rc.far=7;
function aim(){
 rc.setFromCamera({x:0,y:0},cam);
 var h=rc.intersectObjects(surfaces,false)[0];if(!h)return null;
 var n=h.face.normal.clone().transformDirection(h.object.matrixWorld);
 return{p:h.point,n:n};
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pose(t,steps){
 var a=aim();if(!a)return null;var n=a.n,p=a.p,ry,e;
 if(t.kind==='wall'){
  if(Math.abs(n.y)>0.3)return null;
  ry=Math.atan2(n.x,n.z);
  return{x:p.x+n.x*(t.d/2+0.002),y:clamp(p.y,t.h/2+0.3,2.3-t.h/2),z:p.z+n.z*(t.d/2+0.002),r:ry};
 }
 if(n.y>0.7){ry=steps*Math.PI/2;return{x:p.x,y:0,z:p.z,r:ry};}
 if(Math.abs(n.y)<=0.3){
  ry=Math.atan2(n.x,n.z)+steps*Math.PI/2;e=ext(t,ry);
  var off=Math.abs(n.x)*e[0]+Math.abs(n.z)*e[1];
  return{x:p.x+n.x*off,y:0,z:p.z+n.z*off,r:ry};
 }
 return null;
}
// ---- colocar ----
var placing=null,ghost=null,selected=null;
function tint(g,ok){g.traverse(function(o){if(o.isMesh&&o.material.emissive)o.material.emissive.setHex(ok?0x1c7a2c:0x9b1c1c);});}
function startPlacing(t,steps,moving){
 cancelPlacing(true);closeSel();
 placing={t:t,steps:steps||0,moving:moving||null,ok:false,pose:null};
 ghost=new THREE.Group();t.build(ghost);
 ghost.traverse(function(o){if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=0.7;o.castShadow=false;o.receiveShadow=false;}});
 ghost.visible=false;scene.add(ghost);
 $('pname').textContent=(moving?'Moviendo: ':'Colocando: ')+t.n;
 $('pRot').style.display=t.kind==='wall'?'none':'';
 document.body.classList.add('placing');
 if(document.body.classList.contains('panel'))$('bpanel').click();
}
function updateGhost(){
 if(!placing)return;
 var t=placing.t,po=pose(t,placing.steps);placing.pose=po;
 if(!po){ghost.visible=false;placing.ok=false;$('pmsg').textContent=t.kind==='wall'?'Apunta a una pared':'Apunta al piso o a una pared';$('pOk').disabled=true;return;}
 ghost.visible=true;ghost.position.set(po.x,po.y,po.z);ghost.rotation.y=po.r;
 placing.ok=valid(t,po.x,po.y,po.z,po.r);tint(ghost,placing.ok);
 $('pmsg').textContent=placing.ok?'Toca "Colocar"':'No cabe aquí';$('pOk').disabled=!placing.ok;
}
function cancelPlacing(silent){
 if(!placing)return;
 if(ghost){scene.remove(ghost);ghost=null;}
 var mv=placing.moving;placing=null;document.body.classList.remove('placing');
 if(mv&&!silent){addItem(mv.t,mv.x,mv.y,mv.z,mv.r);save();}
 else if(mv&&silent){addItem(mv.t,mv.x,mv.y,mv.z,mv.r);save();}
}
function confirmPlacing(){
 if(!placing||!placing.ok||!placing.pose)return;
 if(userItems.length>=MAXI&&!placing.moving){$('pmsg').textContent='Máximo '+MAXI+' objetos';return;}
 var po=placing.pose,t=placing.t;
 scene.remove(ghost);ghost=null;placing=null;document.body.classList.remove('placing');
 addItem(t,po.x,po.y,po.z,po.r);save();
 if(blocked(P.x,P.z))freeSpot();
}
$('pOk').onclick=confirmPlacing;
$('pCancel').onclick=function(){cancelPlacing(false);};
$('pRot').onclick=function(){if(placing)placing.steps=(placing.steps+1)%4;};
// ---- seleccionar / editar ----
function openSel(it){
 closeSel();selected=it;$('sname').textContent=it.t.n;
 $('sRot').style.display=it.t.kind==='wall'?'none':'';
 document.body.classList.add('selecting');
 it.obj.traverse(function(o){if(o.isMesh&&o.material.emissive){o.material=o.material.clone();o.material.emissive.setHex(0x3a3a00);}});
}
function closeSel(){
 if(!selected)return;
 var it=selected;selected=null;document.body.classList.remove('selecting');
 it.obj.traverse(function(o){if(o.isMesh&&o.material.emissive)o.material.emissive.setHex(0);});
}
$('sClose').onclick=closeSel;
$('sDel').onclick=function(){if(!selected)return;var it=selected;closeSel();removeItem(it);save();};
$('sMove').onclick=function(){
 if(!selected)return;var it=selected;closeSel();
 var mv={t:it.t,x:it.x,y:it.y,z:it.z,r:it.r};removeItem(it);
 startPlacing(it.t,0,mv);
 placing.moving=mv;
};
$('sRot').onclick=function(){
 if(!selected)return;var it=selected,t=it.t,nr=it.r+Math.PI/2;
 unregister(it);
 if(valid(t,it.x,it.y,it.z,nr)){it.r=nr;it.obj.rotation.y=nr;}
 register(it);save();
};
function tapAt(cx,cy){
 if(placing)return;
 var r=cv.getBoundingClientRect();
 rc.setFromCamera({x:((cx-r.left)/r.width)*2-1,y:-((cy-r.top)/r.height)*2+1},cam);
 var meshes=[];userItems.forEach(function(i){meshes.push(i.obj);});
 var h=rc.intersectObjects(meshes,true)[0];
 if(!h){closeSel();return;}
 var o=h.object;while(o&&!o.userData.item)o=o.parent;
 if(o)openSel(o.userData.item);
}
// ---- panel: buscador ----
var sInput=$('buscar'),res=$('res');
function renderRes(){
 var q=norm(sInput.value.trim());res.innerHTML='';
 var list=CAT.filter(function(c){return !q||norm(c.n+' '+c.k).indexOf(q)>=0;});
 if(!list.length){res.innerHTML='<span style="font-size:14px;color:#6b7280">No encontré eso. Prueba con otra palabra.</span>';return;}
 list.forEach(function(c){
  var b=document.createElement('button');b.className='chip';b.textContent=c.i+' '+c.n;
  b.onclick=function(){if(userItems.length>=MAXI){alert('Máximo '+MAXI+' objetos');return;}startPlacing(c,0,null);};
  res.appendChild(b);
 });
}
sInput.addEventListener('input',renderRes);renderRes();
function updCount(){$('mycount').textContent=userItems.length?'Mis objetos ('+userItems.length+')':'';$('clearall').style.display=userItems.length?'':'none';}
$('clearall').onclick=function(){if(!confirm('¿Borrar todos los objetos que agregaste?'))return;userItems.slice().forEach(removeItem);save();};
load();updCount();

/* ---------- entradas ---------- */
var keys={},joy={x:0,y:0};
addEventListener('keydown',function(e){keys[e.code]=true;});
addEventListener('keyup',function(e){keys[e.code]=false;});
var lookId=null,lx=0,ly=0;
var dX=0,dY=0,dT=0,moved=0;
cv.addEventListener('pointerdown',function(e){
 if(lookId!==null)return;lookId=e.pointerId;lx=e.clientX;ly=e.clientY;dX=lx;dY=ly;dT=performance.now();moved=0;cv.setPointerCapture(e.pointerId);
 if(document.body.classList.contains('panel')&&e.pointerType==='mouse')return;
});
cv.addEventListener('pointermove',function(e){
 if(e.pointerId!==lookId)return;
 var k=e.pointerType==='mouse'?0.0035:0.0055;
 P.yaw-=(e.clientX-lx)*k;P.pitch-=(e.clientY-ly)*k;
 P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch));lx=e.clientX;ly=e.clientY;
});
function endLook(e){if(e.pointerId===lookId)lookId=null;}
cv.addEventListener('pointerup',function(e){
 if(e.pointerId===lookId&&Math.hypot(e.clientX-dX,e.clientY-dY)<8&&performance.now()-dT<450)tapAt(e.clientX,e.clientY);
 endLook(e);
});cv.addEventListener('pointercancel',endLook);
// joystick
var st=$('stick'),kn=$('knob'),stId=null;
function stickMove(e){
 var r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 var dx=e.clientX-cx,dy=e.clientY-cy,m=Math.sqrt(dx*dx+dy*dy),max=r.width/2-10;
 if(m>max){dx*=max/m;dy*=max/m;}
 kn.style.transform='translate('+dx+'px,'+dy+'px)';
 joy.x=dx/max;joy.y=-dy/max;
}
st.addEventListener('pointerdown',function(e){stId=e.pointerId;st.setPointerCapture(e.pointerId);stickMove(e);e.preventDefault();});
st.addEventListener('pointermove',function(e){if(e.pointerId===stId)stickMove(e);});
function stickEnd(e){if(e.pointerId!==stId)return;stId=null;joy.x=joy.y=0;kn.style.transform='';}
st.addEventListener('pointerup',stickEnd);st.addEventListener('pointercancel',stickEnd);
document.addEventListener('gesturestart',function(e){e.preventDefault();});

function palette(id,list,mat,def){

  b.onclick=function(){mat.color.set(c[1]);[].forEach.call(box_.children,function(x){x.classList.remove('sel')});b.classList.add('sel');};
  box_.appendChild(b);
 });
}

palette('c-bed',[['Azul','#7fa6c9'],['Blanco','#f2f2f0'],['Gris','#9a9da0'],['Rosa','#e3a9b8'],['Verde','#8fbf9f'],['Guinda','#8a3b4a'],['Mostaza','#d4a843']],M.bed,0);

/* ---------- minimapa ---------- */
var mc=$('mini'),mg=mc.getContext('2d'),S=40,ox=2,oz=2;
function mini(){
 mg.clearRect(0,0,208,208);
 mg.fillStyle='#374151';
 colliders.forEach(function(c){if(c.grp)return;mg.fillRect(ox+c.x0*S,oz+(c.z0+0.05)*S,Math.max(2,(c.x1-c.x0)*S),Math.max(2,(c.z1-c.z0)*S));});
 mg.fillStyle='#e8590c';mg.beginPath();mg.arc(ox+P.x*S,oz+(P.z+0.05)*S,5,0,7);mg.fill();
 mg.strokeStyle='#e8590c';mg.lineWidth=3;mg.beginPath();mg.moveTo(ox+P.x*S,oz+(P.z+0.05)*S);
 mg.lineTo(ox+(P.x-Math.sin(P.yaw)*0.45)*S,oz+(P.z+0.05-Math.cos(P.yaw)*0.45)*S);mg.stroke();
}

/* ---------- bucle ---------- */
function resize(){
 var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
 cam.fov=w/h<1?82:70;cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
var last=performance.now();
function loop(t){
 requestAnimationFrame(loop);
 var dt=Math.min(0.05,(t-last)/1000);last=t;
 var f=joy.y,s=joy.x;
 if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;
 if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;
 if(keys.ArrowLeft||keys.KeyQ)P.yaw+=1.6*dt;if(keys.ArrowRight||keys.KeyE)P.yaw-=1.6*dt;
 var m=Math.sqrt(f*f+s*s);if(m>1){f/=m;s/=m;}
 var sp=1.5*dt,fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
 if(m>0)move((fx*f+rx*s)*sp,(fz*f+rz*s)*sp);
 if(P.x<0.1||P.x>4.9||P.z<0.05||P.z>5.0)setSpot(spots[0]);
 cam.position.set(P.x,P.eye,P.z);cam.rotation.set(P.pitch,P.yaw,0);
 if(placing)updateGhost();
 renderer.render(scene,cam);mini();
}
requestAnimationFrame(loop);
window.__casa={cam:cam,items:userItems,P:P,setSpot:setSpot,spots:spots,colliders:colliders,renderer:renderer};
})();

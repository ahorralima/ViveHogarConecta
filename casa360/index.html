<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Recorrido de mi vivienda</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.b{border:0;border-radius:20px;padding:9px 15px;font-size:14px;font-weight:600;background:#fff;color:#1f2937;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.b.on{background:#e8590c;color:#fff}
#hint{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none;transition:opacity .6s}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#111;font-size:15px;transition:opacity .35s;pointer-events:none}
#hs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hs{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-50%);cursor:pointer}
.hs i{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 0 0 4px rgba(255,255,255,.35),0 2px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;color:#e8590c;animation:pulse 1.8s infinite}
.hs span{background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;border-radius:10px;padding:3px 8px;white-space:nowrap}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hs"></div>
<a href="../" class="b" style="position:fixed;left:10px;bottom:calc(46px + env(safe-area-inset-bottom));text-decoration:none;z-index:5">← Volver</a>
<div id="bar"></div>
<div id="hint">Arrastra para mirar · toca los círculos para pasar a otro cuarto</div>
<div id="ld">Cargando…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var rooms=[['sala','Sala-comedor'],['dorm1','Dormitorio 1'],['dorm2','Dormitorio 2'],['bano','Baño']];
/* puertas en cada imagen: u = posición horizontal (0-1), v = vertical (0 arriba, 1 abajo) */
var HS={
 sala:[{to:'bano',u:.17,v:.52,t:'Baño'},{to:'dorm2',u:.24,v:.52,t:'Dormitorio 2'},{to:'dorm1',u:.295,v:.52,t:'Dormitorio 1'}],
 dorm1:[{to:'sala',u:.18,v:.52,t:'Salir a la sala'}],
 dorm2:[{to:'sala',u:.21,v:.52,t:'Salir a la sala'}],
 bano:[{to:'sala',u:.69,v:.52,t:'Salir a la sala'}]
};
var START={sala:270,dorm1:180,dorm2:180,bano:180};
var cv=document.getElementById('c'),ld=document.getElementById('ld'),hsBox=document.getElementById('hs');
var r=new THREE.WebGLRenderer({canvas:cv,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));
var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(75,1,0.1,100);
var geo=new THREE.SphereGeometry(10,64,40);geo.scale(-1,1,1);
var mat=new THREE.MeshBasicMaterial({color:0xffffff});sc.add(new THREE.Mesh(geo,mat));
var lon=270,lat=0,fov=90,cache={},cur=null,tl=new THREE.TextureLoader(),hsEls=[];
function dir(u,v){var th=2*Math.PI*u,ph=Math.PI*v;return new THREE.Vector3(Math.cos(th)*Math.sin(ph),Math.cos(ph),Math.sin(th)*Math.sin(ph));}
function buildHS(k){
 hsBox.innerHTML='';hsEls=[];
 (HS[k]||[]).forEach(function(h){
  var b=document.createElement('button');b.className='hs';b.innerHTML='<i>➜</i><span>'+h.t+'</span>';
  b.onclick=function(){go(h.to,k);};hsBox.appendChild(b);
  hsEls.push({el:b,p:dir(h.u,h.v).multiplyScalar(8)});
 });
}
function go(k,from){
 var lo=START[k];
 if(from&&HS[k]){HS[k].forEach(function(h){if(h.to===from)lo=h.u*360+180;});}
 show(k,lo);
}
function show(k,startLon){
 [].forEach.call(document.querySelectorAll('.b'),function(b){b.classList.toggle('on',b.dataset.k===k);});
 ld.style.opacity=1;hsBox.style.display='none';
 function done(t){mat.map=t;mat.needsUpdate=true;cur=k;lon=(startLon===undefined?START[k]:startLon);lat=0;buildHS(k);hsBox.style.display='';ld.style.opacity=0;}
 if(cache[k])return setTimeout(function(){done(cache[k]);},180);
 tl.load(k+'.jpg',function(t){t.anisotropy=8;t.minFilter=THREE.LinearFilter;cache[k]=t;done(t);},undefined,function(){ld.textContent='No se pudo cargar la imagen';});
}
var bar=document.getElementById('bar');
rooms.forEach(function(x){var b=document.createElement('button');b.className='b';b.dataset.k=x[0];b.textContent=x[1];b.onclick=function(){show(x[0]);};bar.appendChild(b);});
show('sala');
setTimeout(function(){document.getElementById('hint').style.opacity=0;},9000);
var pts={},pd=0,px=0,py=0;
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];px=e.clientX;py=e.clientY;});
cv.addEventListener('pointermove',function(e){
 if(!pts[e.pointerId])return;pts[e.pointerId]=[e.clientX,e.clientY];
 var ids=Object.keys(pts);
 if(ids.length>=2){var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)fov=Math.max(50,Math.min(110,fov-(d-pd)*0.15));pd=d;return;}
 var k=fov/90*0.1;lon-=(e.clientX-px)*k;lat=Math.max(-85,Math.min(85,lat+(e.clientY-py)*k));px=e.clientX;py=e.clientY;
});
function up(e){delete pts[e.pointerId];pd=0;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();fov=Math.max(50,Math.min(110,fov+e.deltaY*0.05));},{passive:false});
function rs(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;}
addEventListener('resize',rs);rs();
var tmp=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);
 cam.fov=Math.min(125,2*Math.atan(Math.tan(THREE.MathUtils.degToRad(fov)/2)/cam.aspect)*180/Math.PI);cam.updateProjectionMatrix();
 var phi=THREE.MathUtils.degToRad(90-lat),th=THREE.MathUtils.degToRad(lon);
 cam.lookAt(Math.sin(phi)*Math.cos(th),Math.cos(phi),Math.sin(phi)*Math.sin(th));
 cam.updateMatrixWorld();
 r.render(sc,cam);
 var w=innerWidth,h=innerHeight;
 hsEls.forEach(function(o){
  tmp.copy(o.p).project(cam);
  var vis=tmp.z<1&&Math.abs(tmp.x)<1.2&&Math.abs(tmp.y)<1.2;
  o.el.style.display=vis?'':'none';
  if(vis)o.el.style.left=((tmp.x+1)/2*w)+'px',o.el.style.top=((1-tmp.y)/2*h)+'px';
 });
}
loop();
window.__tour={look:function(l,a){lon=l;lat=a||0;},go:go,hs:function(){return hsEls.length}};
})();
</script></body></html>
